<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample Size Navigator</title>
<meta name="description" content="Evidence-based sample size guidance for RNA-seq, GWAS, population genetics, microbiome, experimental biology and qualitative research, with formulas and traceable references.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235a6f4e'/%3E%3Cg stroke='%23fff' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M8 23V17M13 23V12M18 23V15M23 23V9'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Set theme before first paint to avoid a flash
  (function(){try{var s=localStorage.getItem("ssn-theme");var d=s?s==="dark":matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.dataset.theme=d?"dark":"light";}catch(e){}})();
</script>
<style>
:root, [data-theme="light"] {
  --bg:#f4f2ee; --surface:#ffffff; --surface-2:#edeae4; --border:#d6d1c9; --border-strong:#a9a296;
  --accent:#5a6f4e; --accent-soft:#e6ece2; --accent-text:#41543a; --on-accent:#ffffff;
  --text:#2b2b2b; --text-2:#55534f; --text-3:#7d7a74;
  --emp:#2f6f3d; --emp-bg:#e3efe5; --calc:#285e86; --calc-bg:#e1ecf5; --heur:#8a5f14; --heur-bg:#f5ecd6; --none:#6b5b95; --none-bg:#ece7f5;
  --ref-bg:#f9f8f5; --caveat-bg:#f5ecd6; --caveat-border:#e4d2a6; --focus:#285e86;
}
[data-theme="dark"] {
  --bg:#0f1219; --surface:#181d2a; --surface-2:#212839; --border:#2d3548; --border-strong:#4a5570;
  --accent:#7cb668; --accent-soft:#1c2a1f; --accent-text:#9bd287; --on-accent:#0f1219;
  --text:#e4e8ef; --text-2:#aab4c3; --text-3:#7d889b;
  --emp:#7fd18a; --emp-bg:rgba(127,209,138,.13); --calc:#86bff0; --calc-bg:rgba(134,191,240,.13); --heur:#f0c060; --heur-bg:rgba(240,192,96,.13); --none:#bba6ec; --none-bg:rgba(187,166,236,.13);
  --ref-bg:#141926; --caveat-bg:rgba(240,192,96,.10); --caveat-border:rgba(240,192,96,.28); --focus:#86bff0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.55;transition:background .25s,color .25s}
.wrap{max-width:820px;margin:0 auto;padding:42px 24px 72px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:13px}
h1{font-size:23px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.tag{font-size:14px;color:var(--text-3)}
.intro{color:var(--text-2);margin-bottom:34px}
.intro b{color:var(--text);font-weight:600}
.theme-btn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.theme-btn:hover{border-color:var(--border-strong);color:var(--text)}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.step{border:0;margin-bottom:28px}
.step legend{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600;margin-bottom:14px}
.step-n{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:var(--accent-soft);color:var(--accent-text)}
.grid{display:grid;gap:10px}
.cols-1{grid-template-columns:1fr}.cols-2{grid-template-columns:repeat(2,1fr)}.cols-3{grid-template-columns:repeat(3,1fr)}.cols-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:620px){.cols-2,.cols-3{grid-template-columns:1fr}.cols-4{grid-template-columns:repeat(2,1fr)}}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 16px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--border-strong)}
.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.opt-ic{display:inline-flex;color:var(--text-3);margin-top:3px;flex-shrink:0;width:18px;justify-content:center}
.opt.sel .opt-ic{color:var(--accent-text)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border-strong);margin-top:5px}
.opt-txt{display:flex;flex-direction:column}
.opt-label{font-size:16px;font-weight:500;line-height:1.4}
.opt.sel .opt-label{font-weight:600;color:var(--accent-text)}
.opt-hint{font-size:13.5px;color:var(--text-3);margin-top:2px}
.result{margin-top:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:28px 26px;scroll-margin-top:16px}
.badges{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.ev{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:4px 10px;border-radius:5px}
.ev-emp{color:var(--emp);background:var(--emp-bg)}.ev-calc{color:var(--calc);background:var(--calc-bg)}.ev-heur{color:var(--heur);background:var(--heur-bg)}.ev-none{color:var(--none);background:var(--none-bg)}
.ev-help{font-size:13.5px;color:var(--text-3)}
.result h2{font-size:22px;font-weight:700;line-height:1.3;margin:12px 0 8px}
.summary{color:var(--text-2);margin-bottom:22px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
@media (max-width:620px){.metrics{grid-template-columns:1fr}}
.metric{background:var(--surface-2);border-radius:10px;padding:15px 17px}
.m-label{font-size:12.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--text-3)}
.m-value{font-size:25px;font-weight:700;line-height:1.25;margin-top:3px;font-variant-numeric:tabular-nums;word-break:break-word}
.m-note{font-size:13px;color:var(--text-3);margin-top:3px}
.sub-h{font-size:16px;font-weight:600;margin:4px 0 10px}
.params{border:1.5px dashed var(--border);border-radius:10px;padding:16px 18px;margin-bottom:24px}
.param-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
@media (max-width:620px){.param-grid{grid-template-columns:1fr}}
.param{display:flex;flex-direction:column;gap:5px}
.param-label{font-size:14px;font-weight:600}
.param input{font:inherit;font-size:16px;padding:9px 11px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);width:100%;font-variant-numeric:tabular-nums}
.param input:focus{border-color:var(--accent)}
.param-help{font-size:12.5px;color:var(--text-3);line-height:1.4}
.link-btn{margin-top:12px;background:none;border:0;color:var(--accent-text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0}
.details{list-style:none;margin-bottom:22px}
.details li{position:relative;padding-left:20px;margin-bottom:9px;font-size:16px;color:var(--text-2)}
.details li::before{content:"›";position:absolute;left:3px;top:0;color:var(--accent);font-weight:700}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
@media (max-width:620px){.info-grid{grid-template-columns:1fr}}
.info{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:14.5px}
.info-h{font-size:12px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--text-3);margin-bottom:4px}
.refs summary{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--accent-text);cursor:pointer;margin-bottom:12px;list-style:none}
.refs summary::-webkit-details-marker{display:none}
.refs ol{list-style:none}
.ref{background:var(--ref-bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.ref-cite{font-size:14.5px;font-weight:500;line-height:1.5}
.ref-n{color:var(--text-3);font-weight:600;margin-right:7px}
.ref-src{font-size:13.5px;color:var(--text-3);margin-top:4px;word-break:break-word}
.ref-src a{color:var(--calc);text-decoration:none}.ref-src a:hover{text-decoration:underline}
.ref-note{font-size:13.5px;color:var(--text-2);margin-top:8px;padding-left:12px;border-left:2px solid var(--border);line-height:1.5}
.ref-note strong{color:var(--text)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:15px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent-text)}
.btn.ghost{background:transparent;color:var(--text-3);justify-content:center}
.btn.wide{width:100%}
.caveat{margin:24px 0 16px;background:var(--caveat-bg);border:1px solid var(--caveat-border);border-radius:10px;padding:14px 17px;font-size:14.5px;color:var(--text-2)}
.caveat strong{color:var(--heur)}
footer{margin-top:48px;padding-top:22px;border-top:1px solid var(--border);text-align:center;font-size:13.5px;color:var(--text-3)}
noscript{display:block;padding:40px;text-align:center}
@media (max-width:620px){.wrap{padding:28px 16px 56px}body{font-size:16px}.result{padding:22px 18px}}
@media print{.theme-btn,.actions,.btn,.params .link-btn{display:none}body{background:#fff}.result{border-color:#999}}
</style>
</head>
<body>
<div id="root"></div>
<noscript>This tool needs JavaScript enabled.</noscript>
<script>/*__BUNDLE__*/</script>
</body>
</html>
