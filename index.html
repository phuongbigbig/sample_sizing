/* ===== RECOMMENDATION ENGINE (all references included) ===== */
function getRec(a) {
  if (a.studyType==="rnaseq") return rnaseqRec(a.rnaseqGoal, a.organism);
  if (a.studyType==="gwas") return gwasRec(a.gwasDesign, a.effectSize);
  if (a.studyType==="popgen") return popgenRec(a.popgenGoal, a.markerType);

  if (a.studyType==="experimental") return expRec(a.expDesign, a.effectSize, a.numGroups);

  return null;

/* ===== UI COMPONENTS (theme-aware via useT) ===== */
function Option({ label, selected, onClick, icon }) {
  var C = useT();
  return <button onClick={onClick} style={{ display:"flex",alignItems:"center",gap:12, background:selected?C.accentLight:C.surface, border:"1.5px solid "+(selected?C.borderActive:C.border), borderRadius:10,padding:"13px 17px",cursor:"pointer", transition:"all 0.15s",textAlign:"left",width:"100%",outline:"none" }}
    onMouseEnter={function(e){if(!selected)e.currentTarget.style.borderColor=C.textTertiary}}
    onMouseLeave={function(e){if(!selected)e.currentTarget.style.borderColor=C.border}}>
    {selected && <MiniIcon name="check" size={17} color={C.accent}/>}
    {icon && !selected && <MiniIcon name={icon} size={18} color={C.textTertiary}/>}
    <span style={{ color:selected?C.accentText:C.text, fontWeight:selected?600:450, fontSize:17, lineHeight:1.4 }}>{label}</span>
  </button>;
}

function OptionGrid({ options, value, onChange, cols }) {
  return <div style={{ display:"grid", gridTemplateColumns:"repeat("+(cols||2)+", 1fr)", gap:10 }}>
    {options.map(function(o){ return <Option key={o.id} label={o.label} selected={value===o.id} onClick={function(){onChange(o.id)}} icon={o.icon}/> })}
  </div>;
}

function Step({ n, label }) {
  var C = useT();
  return <div style={{ display:"flex",alignItems:"center",gap:12,marginBottom:14 }}>
    <span style={{ width:28,height:28,borderRadius:"50%",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,background:C.accentLight,color:C.accent }}>{n}</span>
    <span style={{ fontSize:18,fontWeight:600,color:C.text }}>{label}</span>
  </div>;
}

function Tag({ label, type }) {
  var C = useT();
  var m = {green:{bg:C.tagGreenBg,fg:C.tagGreen},amber:{bg:C.tagAmberBg,fg:C.tagAmber},red:{bg:C.tagRedBg,fg:C.tagRed},purple:{bg:C.tagPurpleBg,fg:C.tagPurple}};
  var t = m[type]||m.amber;
  return <span style={{ display:"inline-block",background:t.bg,color:t.fg,fontSize:13,fontWeight:600,padding:"4px 11px",borderRadius:5,letterSpacing:0.5,textTransform:"uppercase" }}>{label}</span>;
}

function Metric({ label, value, note }) {
  var C = useT();
  return <div style={{ flex:1,minWidth:140,padding:"16px 18px",background:C.surfaceAlt,borderRadius:10 }}>
    <div style={{ fontSize:13,color:C.textTertiary,textTransform:"uppercase",letterSpacing:0.8,marginBottom:5,fontWeight:600 }}>{label}</div>
    <div style={{ fontSize:24,fontWeight:700,color:C.text,lineHeight:1.2 }}>{value}</div>
    {note && <div style={{ fontSize:13,color:C.textTertiary,marginTop:4 }}>{note}</div>}
  </div>;
}

function RefCard({ r, index }) {
  var C = useT();
  return <div style={{ background:C.refBg,border:"1px solid "+C.refBorder,borderRadius:10,padding:"14px 16px",marginBottom:10 }}>
    <div style={{ fontSize:14,color:C.text,lineHeight:1.55,fontWeight:500 }}>
      <span style={{ color:C.textTertiary,fontWeight:600,marginRight:7 }}>{"["+index+"]"}</span>{r.text}
    </div>
    <div style={{ fontSize:13,color:C.textTertiary,marginTop:4 }}>
      <em>{r.journal}</em>{r.year?" ("+r.year+")":""}{r.vol?" "+r.vol:""}
      {r.doi&&r.doi.length>0&&<span>{" \u00b7 "}<a href={"https://doi.org/"+r.doi} target="_blank" rel="noreferrer" style={{ color:C.accent,textDecoration:"none" }}>{"doi:"+r.doi}</a></span>}
    </div>
    {r.note && <div style={{ fontSize:13,color:C.textSecondary,marginTop:7,lineHeight:1.55,borderLeft:"2px solid "+C.border,paddingLeft:12 }}>
      <strong style={{ color:C.text }}>Why this source: </strong>{r.note}
    </div>}
  </div>;
}

function Result({ rec }) {
  if(!rec)return null;
  var C = useT();
  var [showRefs,setShowRefs]=useState(true);
  var tagLabel={green:"Achievable",amber:"Moderate",red:"Demanding",purple:"Context-dependent"};
  return <div style={{ marginTop:24,background:C.surface,border:"1.5px solid "+C.border,borderRadius:14,padding:"28px 26px" }}>
    <Tag label={tagLabel[rec.tag]||"Guidance"} type={rec.tag}/>
    <h2 style={{ fontSize:22,fontWeight:700,color:C.text,margin:"10px 0 8px",lineHeight:1.3 }}>{rec.title}</h2>
    <p style={{ fontSize:17,color:C.textSecondary,lineHeight:1.55,margin:"0 0 22px" }}>{rec.summary}</p>
    <div style={{ display:"flex",gap:12,flexWrap:"wrap",marginBottom:26 }}>
      <Metric label="Minimum" value={rec.min} note="per group"/>
      <Metric label="Recommended" value={rec.rec} note="per group"/>
      <Metric label="Ideal" value={rec.ideal} note="per group"/>
    </div>
    <div style={{ marginBottom:24 }}>
      <div style={{ fontSize:16,fontWeight:600,color:C.text,marginBottom:10 }}>Key guidance</div>
      {rec.details.map(function(d,i){ return <div key={i} style={{ display:"flex",gap:10,marginBottom:8,fontSize:16,color:C.textSecondary,lineHeight:1.55 }}>
        <span style={{ color:C.accent,flexShrink:0,fontWeight:700 }}>{"\u203a"}</span><span>{d}</span>
      </div> })}
    </div>
    <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:24 }}>
      <div style={{ background:C.surfaceAlt,borderRadius:10,padding:"12px 14px" }}>
        <div style={{ fontSize:12,color:C.textTertiary,textTransform:"uppercase",letterSpacing:0.8,fontWeight:600,marginBottom:4 }}>Power target</div>
        <div style={{ fontSize:14,color:C.text,lineHeight:1.4 }}>{rec.power}</div>
      </div>
      <div style={{ background:C.surfaceAlt,borderRadius:10,padding:"12px 14px" }}>
        <div style={{ fontSize:12,color:C.textTertiary,textTransform:"uppercase",letterSpacing:0.8,fontWeight:600,marginBottom:4 }}>Recommended tools</div>
        <div style={{ fontSize:14,color:C.text,lineHeight:1.4 }}>{rec.tools}</div>
      </div>
    </div>
    {rec.refs&&rec.refs.length>0&&<div>
      <button onClick={function(){setShowRefs(!showRefs)}} style={{ display:"flex",alignItems:"center",gap:8,background:"none",border:"none",cursor:"pointer",padding:0,fontSize:16,fontWeight:600,color:C.accent,marginBottom:showRefs?12:0 }}>
        <MiniIcon name="book" size={17} color={C.accent}/>
        {"Sources & evidence ("+rec.refs.length+" references)"}
        <span style={{ fontSize:13,transition:"transform 0.2s",transform:showRefs?"rotate(180deg)":"rotate(0)",display:"inline-block" }}>{"\u25be"}</span>
      </button>
      {showRefs&&<div>
        <div style={{ fontSize:13,color:C.textTertiary,marginBottom:12,lineHeight:1.55 }}>Each reference explains how it supports the recommendation. DOI links open the original publication.</div>
        {rec.refs.map(function(r,i){ return <RefCard key={i} r={r} index={i+1}/> })}
      </div>}
    </div>}
  </div>;
}

/* ===== THEME TOGGLE ===== */
function ThemeToggle({ dark, onToggle }) {

    background:C.toggleBg, cursor:"pointer", outline:"none", padding:0, transition:"background 0.3s",
  }}>
    <span style={{
      position:"absolute", top:3, left:dark?27:3, width:22, height:22, borderRadius:11,
      background:C.toggleKnob, transition:"left 0.25s ease", display:"flex", alignItems:"center", justifyContent:"center", fontSize:13,
    }}>{dark?"\u263e":"\u2600"}</span>
  </button>;
}

    try{localStorage.setItem("ssn-theme",dark?"dark":"light")}catch(e){}

  var [a,setA] = useState({studyType:null,rnaseqGoal:null,popgenGoal:null,markerType:null,qualGoal:null,gwasDesign:null,expDesign:null,effectSize:null,microbiomeGoal:null,numGroups:"2",organism:null});

    if(a.studyType==="microbiome")return !!a.microbiomeGoal;
    if(a.studyType==="experimental")return !!a.expDesign&&!!a.effectSize;
    if(a.studyType==="qualitative")return !!a.qualGoal;

  function NumBtn({val}){return <button onClick={function(){s("numGroups",val)}} style={{flex:1,padding:"12px 0",borderRadius:10,cursor:"pointer",border:"1.5px solid "+(a.numGroups===val?C.borderActive:C.border),background:a.numGroups===val?C.accentLight:C.surface,color:a.numGroups===val?C.accentText:C.text,fontWeight:600,fontSize:18,outline:"none"}}>{val}</button>}

            <svg width="32" height="32" viewBox="0 0 28 28" fill="none">
              <rect width="28" height="28" rx="7" fill={C.accent}/>
              <path d="M8 20V10l3-3h6l3 3v10" stroke="#fff" strokeWidth="1.8" fill="none" strokeLinejoin="round"/>
              <line x1="8" y1="15" x2="20" y2="15" stroke="#fff" strokeWidth="1.2" opacity="0.5"/>
              <line x1="14" y1="7" x2="14" y2="20" stroke="#fff" strokeWidth="1.2" opacity="0.5"/>
              <circle cx="11" cy="12" r="1.2" fill="#fff" opacity="0.7"/>
              <circle cx="17" cy="18" r="1.2" fill="#fff" opacity="0.7"/>
            </svg>
            <span style={{ fontSize:22,fontWeight:700,color:C.text,letterSpacing:-0.3 }}>Sample Size Navigator</span>
          </div>
          <ThemeToggle dark={dark} onToggle={function(){setDark(!dark)}}/>
        </div>
        <p style={{ fontSize:17,color:C.textSecondary,lineHeight:1.6,margin:0 }}>
          Evidence-based sample size guidance for biology, genetics, and genomics research. Select your study type to receive recommendations with traceable references.
        </p>
      </div>

      {/* Step 1 */}
      <div style={{ marginBottom:26 }}>
        <Step n={1} label="Study type"/>
        <OptionGrid options={STUDY_TYPES} value={a.studyType} onChange={function(v){reset();s("studyType",v)}} cols={2}/>
      </div>

      {a.studyType==="rnaseq"&&<React.Fragment>
        <div style={{marginBottom:26}}><Step n={2} label="Analytical goal"/><OptionGrid options={RNASEQ_GOALS} value={a.rnaseqGoal} onChange={function(v){s("rnaseqGoal",v)}} cols={1}/></div>
        {a.rnaseqGoal&&a.rnaseqGoal!=="scrnaseq"&&<div style={{marginBottom:26}}><Step n={3} label="Organism"/><OptionGrid options={[{id:"model",label:"Model / well-annotated genome"},{id:"non_model",label:"Non-model / limited annotation"}]} value={a.organism} onChange={function(v){s("organism",v)}} cols={2}/></div>}
      </React.Fragment>}
      {a.studyType==="gwas"&&<React.Fragment>
        <div style={{marginBottom:26}}><Step n={2} label="Study design"/><OptionGrid options={GWAS_DESIGNS} value={a.gwasDesign} onChange={function(v){s("gwasDesign",v)}} cols={3}/></div>
        {a.gwasDesign&&<div style={{marginBottom:26}}><Step n={3} label="Expected effect size"/><OptionGrid options={EFFECT_SIZES} value={a.effectSize} onChange={function(v){s("effectSize",v)}} cols={2}/></div>}
      </React.Fragment>}
      {a.studyType==="popgen"&&<React.Fragment>
        <div style={{marginBottom:26}}><Step n={2} label="Analysis goal"/><OptionGrid options={POPGEN_GOALS} value={a.popgenGoal} onChange={function(v){s("popgenGoal",v)}} cols={1}/></div>
        {a.popgenGoal&&<div style={{marginBottom:26}}><Step n={3} label="Marker type"/><OptionGrid options={MARKER_TYPES} value={a.markerType} onChange={function(v){s("markerType",v)}} cols={2}/></div>}
      </React.Fragment>}
      {a.studyType==="microbiome"&&<React.Fragment>
        <div style={{marginBottom:26}}><Step n={2} label="Analysis goal"/><OptionGrid options={MICROBIOME_GOALS} value={a.microbiomeGoal} onChange={function(v){s("microbiomeGoal",v)}} cols={1}/></div>
        {a.microbiomeGoal&&<div style={{marginBottom:26}}><Step n={3} label="Number of groups"/><div style={{display:"flex",gap:10}}><NumBtn val="2"/><NumBtn val="3"/><NumBtn val="4"/><NumBtn val="5"/></div></div>}
      </React.Fragment>}
      {a.studyType==="experimental"&&<React.Fragment>
        <div style={{marginBottom:26}}><Step n={2} label="Design"/><OptionGrid options={EXP_DESIGNS} value={a.expDesign} onChange={function(v){s("expDesign",v)}} cols={2}/></div>
        {a.expDesign&&<div style={{marginBottom:26}}><Step n={3} label="Expected effect size"/><OptionGrid options={EFFECT_SIZES} value={a.effectSize} onChange={function(v){s("effectSize",v)}} cols={2}/></div>}
        {a.expDesign&&a.effectSize&&<div style={{marginBottom:26}}><Step n={4} label="Number of groups"/><div style={{display:"flex",gap:10}}><NumBtn val="2"/><NumBtn val="3"/><NumBtn val="4"/><NumBtn val="5"/><NumBtn val="6"/></div></div>}
      </React.Fragment>}
      {a.studyType==="qualitative"&&<div style={{marginBottom:26}}><Step n={2} label="Analytical approach"/><OptionGrid options={QUAL_GOALS} value={a.qualGoal} onChange={function(v){s("qualGoal",v)}} cols={1}/></div>}

      {done&&rec&&<Result rec={rec}/>}

      {done&&<div style={{marginTop:24}}>
        <div style={{background:C.tagAmberBg,borderRadius:10,padding:"14px 17px",marginBottom:16,border:"1px solid rgba(154,107,30,0.15)"}}>
          <div style={{fontSize:14,fontWeight:600,color:C.tagAmber,marginBottom:4}}>Important</div>
          <div style={{fontSize:14,color:C.textSecondary,lineHeight:1.6}}>
            These are evidence-based guidelines, not absolute rules. Always conduct formal power analysis when possible and document your justification in manuscripts and grant proposals.
          </div>
        </div>
        <button onClick={reset} style={{width:"100%",padding:"12px 0",borderRadius:10,cursor:"pointer",border:"1.5px solid "+C.border,background:"transparent",color:C.textTertiary,fontSize:16,fontWeight:500,outline:"none",transition:"all 0.15s"}}
          onMouseEnter={function(e){e.currentTarget.style.borderColor=C.accent;e.currentTarget.style.color=C.accent}}
          onMouseLeave={function(e){e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.textTertiary}}>Start over</button>
      </div>}

      <div style={{marginTop:48,paddingTop:24,borderTop:"1px solid "+C.border,textAlign:"center"}}>
        <div style={{fontSize:13,color:C.textTertiary,lineHeight:1.6}}>
          Built on Wutich, Beresford & Bernard (2024, <em>IJQM</em>) and peer-reviewed genomics literature.
          <br/>Not a substitute for formal power analysis or biostatistical consultation.
        </div>
      </div>
    </div>
  </ThemeCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
