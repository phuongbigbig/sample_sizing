<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample Size Navigator</title>
<meta name="description" content="Evidence-based sample size guidance for RNA-seq, GWAS, population genetics, microbiome, experimental biology and qualitative research, with formulas and traceable references.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235a6f4e'/%3E%3Cg stroke='%23fff' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M8 23V17M13 23V12M18 23V15M23 23V9'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Set theme before first paint to avoid a flash
  (function(){try{var s=localStorage.getItem("ssn-theme");var d=s?s==="dark":matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.dataset.theme=d?"dark":"light";}catch(e){}})();
</script>
<style>
:root, [data-theme="light"] {
  --bg:#f4f2ee; --surface:#ffffff; --surface-2:#edeae4; --border:#d6d1c9; --border-strong:#a9a296;
  --accent:#5a6f4e; --accent-soft:#e6ece2; --accent-text:#41543a; --on-accent:#ffffff;
  --text:#2b2b2b; --text-2:#55534f; --text-3:#7d7a74;
  --emp:#2f6f3d; --emp-bg:#e3efe5; --calc:#285e86; --calc-bg:#e1ecf5; --heur:#8a5f14; --heur-bg:#f5ecd6; --none:#6b5b95; --none-bg:#ece7f5;
  --ref-bg:#f9f8f5; --caveat-bg:#f5ecd6; --caveat-border:#e4d2a6; --focus:#285e86;
}
[data-theme="dark"] {
  --bg:#0f1219; --surface:#181d2a; --surface-2:#212839; --border:#2d3548; --border-strong:#4a5570;
  --accent:#7cb668; --accent-soft:#1c2a1f; --accent-text:#9bd287; --on-accent:#0f1219;
  --text:#e4e8ef; --text-2:#aab4c3; --text-3:#7d889b;
  --emp:#7fd18a; --emp-bg:rgba(127,209,138,.13); --calc:#86bff0; --calc-bg:rgba(134,191,240,.13); --heur:#f0c060; --heur-bg:rgba(240,192,96,.13); --none:#bba6ec; --none-bg:rgba(187,166,236,.13);
  --ref-bg:#141926; --caveat-bg:rgba(240,192,96,.10); --caveat-border:rgba(240,192,96,.28); --focus:#86bff0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.55;transition:background .25s,color .25s}
.wrap{max-width:820px;margin:0 auto;padding:42px 24px 72px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:13px}
h1{font-size:23px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.tag{font-size:14px;color:var(--text-3)}
.intro{color:var(--text-2);margin-bottom:34px}
.intro b{color:var(--text);font-weight:600}
.theme-btn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.theme-btn:hover{border-color:var(--border-strong);color:var(--text)}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.step{border:0;margin-bottom:28px}
.step legend{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600;margin-bottom:14px}
.step-n{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:var(--accent-soft);color:var(--accent-text)}
.grid{display:grid;gap:10px}
.cols-1{grid-template-columns:1fr}.cols-2{grid-template-columns:repeat(2,1fr)}.cols-3{grid-template-columns:repeat(3,1fr)}.cols-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:620px){.cols-2,.cols-3{grid-template-columns:1fr}.cols-4{grid-template-columns:repeat(2,1fr)}}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 16px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--border-strong)}
.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.opt-ic{display:inline-flex;color:var(--text-3);margin-top:3px;flex-shrink:0;width:18px;justify-content:center}
.opt.sel .opt-ic{color:var(--accent-text)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border-strong);margin-top:5px}
.opt-txt{display:flex;flex-direction:column}
.opt-label{font-size:16px;font-weight:500;line-height:1.4}
.opt.sel .opt-label{font-weight:600;color:var(--accent-text)}
.opt-hint{font-size:13.5px;color:var(--text-3);margin-top:2px}
.result{margin-top:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:28px 26px;scroll-margin-top:16px}
.badges{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.ev{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:4px 10px;border-radius:5px}
.ev-emp{color:var(--emp);background:var(--emp-bg)}.ev-calc{color:var(--calc);background:var(--calc-bg)}.ev-heur{color:var(--heur);background:var(--heur-bg)}.ev-none{color:var(--none);background:var(--none-bg)}
.ev-help{font-size:13.5px;color:var(--text-3)}
.result h2{font-size:22px;font-weight:700;line-height:1.3;margin:12px 0 8px}
.summary{color:var(--text-2);margin-bottom:22px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
@media (max-width:620px){.metrics{grid-template-columns:1fr}}
.metric{background:var(--surface-2);border-radius:10px;padding:15px 17px}
.m-label{font-size:12.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--text-3)}
.m-value{font-size:25px;font-weight:700;line-height:1.25;margin-top:3px;font-variant-numeric:tabular-nums;word-break:break-word}
.m-note{font-size:13px;color:var(--text-3);margin-top:3px}
.sub-h{font-size:16px;font-weight:600;margin:4px 0 10px}
.params{border:1.5px dashed var(--border);border-radius:10px;padding:16px 18px;margin-bottom:24px}
.param-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
@media (max-width:620px){.param-grid{grid-template-columns:1fr}}
.param{display:flex;flex-direction:column;gap:5px}
.param-label{font-size:14px;font-weight:600}
.param input{font:inherit;font-size:16px;padding:9px 11px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);width:100%;font-variant-numeric:tabular-nums}
.param input:focus{border-color:var(--accent)}
.param-help{font-size:12.5px;color:var(--text-3);line-height:1.4}
.link-btn{margin-top:12px;background:none;border:0;color:var(--accent-text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0}
.details{list-style:none;margin-bottom:22px}
.details li{position:relative;padding-left:20px;margin-bottom:9px;font-size:16px;color:var(--text-2)}
.details li::before{content:"›";position:absolute;left:3px;top:0;color:var(--accent);font-weight:700}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
@media (max-width:620px){.info-grid{grid-template-columns:1fr}}
.info{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:14.5px}
.info-h{font-size:12px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--text-3);margin-bottom:4px}
.refs summary{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--accent-text);cursor:pointer;margin-bottom:12px;list-style:none}
.refs summary::-webkit-details-marker{display:none}
.refs ol{list-style:none}
.ref{background:var(--ref-bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.ref-cite{font-size:14.5px;font-weight:500;line-height:1.5}
.ref-n{color:var(--text-3);font-weight:600;margin-right:7px}
.ref-src{font-size:13.5px;color:var(--text-3);margin-top:4px;word-break:break-word}
.ref-src a{color:var(--calc);text-decoration:none}.ref-src a:hover{text-decoration:underline}
.ref-note{font-size:13.5px;color:var(--text-2);margin-top:8px;padding-left:12px;border-left:2px solid var(--border);line-height:1.5}
.ref-note strong{color:var(--text)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:15px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent-text)}
.btn.ghost{background:transparent;color:var(--text-3);justify-content:center}
.btn.wide{width:100%}
.caveat{margin:24px 0 16px;background:var(--caveat-bg);border:1px solid var(--caveat-border);border-radius:10px;padding:14px 17px;font-size:14.5px;color:var(--text-2)}
.caveat strong{color:var(--heur)}
footer{margin-top:48px;padding-top:22px;border-top:1px solid var(--border);text-align:center;font-size:13.5px;color:var(--text-3)}
noscript{display:block;padding:40px;text-align:center}
@media (max-width:620px){.wrap{padding:28px 16px 56px}body{font-size:16px}.result{padding:22px 18px}}
@media print{.theme-btn,.actions,.btn,.params .link-btn{display:none}body{background:#fff}.result{border-color:#999}}
</style>
</head>

<div id="root"></div>

of surveys, Wutich et al. (2024) cite 55\u201375 interviews to detect most high-impact problems."],refs:["wutich2024","guest2006","hennink2022","hennink2017","hennink2019","squire2024"]},meaning:{title:"Meaning saturation",evidence:"empirical",m:[["Interviews",24,""],["Focus groups",8,""],["Interviews (range)","16\u201324","Hennink et al. 2017"]],details:["Meaning saturation = understanding the full depth and variation of each theme, not only that it exists.","Hennink et al. (2017): code saturation at 9 interviews, meaning saturation at 16\u201324. For focus groups, 4 groups reached code saturation and more were needed for meaning (Hennink et al. 2019); Wutich et al. (2024) give 8.","Wutich et al. (2024) identify meaning saturation as the most useful saturation concept for descriptive thematic research."],refs:["wutich2024","hennink2017","hennink2019","hennink2022"]},grounded:{title:"Theoretical saturation (grounded theory)",evidence:"empirical",m:[["Interviews",20,"typical lower bound"],["Interviews","20\u201330+","meta-analyses"],["A priori","Not fixed","iterative sampling"]],details:["Theoretical saturation cannot be fixed in advance; sampling continues until no new properties of categories emerge (Glaser & Strauss 1967).","Reviews of published grounded theory studies show 20\u201330+ interviews are typically sufficient to claim theoretical saturation (Mason 2010; Thomson 2011).","Document theoretical sampling decisions; reviewers look for them."],refs:["wutich2024","thomson2011","mason2010","glaser1967"]},metatheme:{title:"Metatheme saturation (cross-site)",evidence:"empirical",m:[["Interviews / site",20,"each metatheme seen once"],["Interviews / site","20\u201340","recommended"],["Interviews / site",39,"each seen \u2265 3 times"]],details:["Hagaman & Wutich (2017), four sites: all metathemes appeared within 20 interviews per site; reliable identification (\u2265 3 occurrences per site) took up to 39.","Heterogeneous samples saturated faster (~18) than homogeneous samples (35\u201339) \u2014 a result that still needs replication.","Each site needs adequate sampling in its own right."],refs:["wutich2024","hagaman2017"]},freelist:{title:"Saturation in salience (free lists)",evidence:"empirical",m:[["Free lists",10,"if exhaustively probed"],["Salient items","\u2248 95%","captured by 10 lists"],["Probing","Essential","see note"]],details:["About 10 exhaustive free lists produce 95% of salient items (Weller et al. 2018).","Superficial interviewing with few probes reaches apparent saturation quickly while missing items \u2014 a false stopping point.","Salience (Smith's S) identifies the items to carry into structured questions or surveys."],refs:["wutich2024","weller2018"]},ethno:{title:"Ethnography",evidence:"empirical",m:[["Data documents",50,"\u2248 80% of themes"],["Data documents",81,"\u2248 90% of themes"],["Structured interviews","20\u201330","cultural consensus"]],details:["DiStefano & Yang (2024): 50 documents (33 observation field notes + 17 interview transcripts) identified 80% of themes; 81 (55 + 26) identified 90%.","Cultural consensus analysis of structured questions: about 20\u201330 informants per topic (Weller 2007); not applicable to free lists, pile sorts or unstructured interviews.","Time in the field and language ability affect what informants share on sensitive topics (Wutich et al. 2024)."],refs:["wutich2024","distefano2024","weller2007"]},content:{title:"Content analysis",evidence:"formula",m:[["Classical","Power analysis","random sample or census"],["Qualitative","Information power","judgement-based"],["Cross-case","\u2248 2\xD7","e.g. men vs. women"]],details:["Classical content analysis that generalises to a corpus needs a random sample or census, with size set by statistical power (Krippendorff 2013; Weller 2015 gives an accessible method).","Qualitative content analysis: information power (Malterud et al. 2016) \u2014 larger samples for broader aims, less specific samples, no guiding theory, weaker d elow 12 replicates."},hart2013:{cite:"Hart SN, Therneau TM, Zhang Y, Poland GA, Kocher J-P. Calculating sample size estimates for RNA sequencing data.",journal:"Journal of Computational Biology",year:2013,vol:"20(12):970\u2013978",doi:"10.1089/cmb.2012.0283",note:"Source of the formula used in this app's RNA-seq calculator (implemented in the RNASeqPower R package). Required n depends on read depth per gene, biological CV, fold change, \u03B1 and power. Our implementation reproduces the package's documented example values (33.4, 49.7, 72.7 per group)."},edgerGuide:{cite:"Chen Y, McCarthy D, Ritchie M, Robinson M, Smyth G. edgeR: differential analysis of sequence read count data \u2014 User's Guide.",journal:"Bioconductor package vignette",year:null,vol:"",doi:"",url:"https://bioconductor.org/packages/edgeR",note:"Gives typical biological coefficients of variation (BCV): about 0.4 for human data and 0.1 for genetically identical model organisms. Used here as default CV values."},lamarre2018:{cite:"Lamarre S, Frasse P, Zouine M, et al. Optimization of an RNA-Seq differential gene expression analysis depending on biological replicate number and library size.",journal:"Frontiers in Plant Science",year:2018,vol:"9:108",doi:"10.3389/fpls.2018.00108",note:"Replicate number affects power more than library size (except for low-expressed genes). Optimal FDR threshold \u2248 2^\u2212r for r replicates. For tomato, recommends \u22654 replicates and 20 M reads per sample."},liu2014:{cite:"Liu Y, Zhou J, White KP. RNA-seq differential expression studies: more sequence or more replication?",journal:"Bioinformatics",year:2014,vol:"30(3):301\u2013304",doi:"10.1093/bioinformatics/btt688",note:"Adding biological replicates increases DE detection power more than adding sequencing depth beyond moderate depth."},conesa2016:{cite:"Conesa A, Madrigal P, Tarazona S, et al. A survey of best practices for RNA-seq data analysis.",journal:"Genome Biology",year:2016,vol:"17:13",doi:"10.1186/s13059-016-0881-8",note:"Best-practice review covering replication, depth and analysis choices; recommends biological replication and power analysis at the design stage."},zhao2018:{cite:"Zhao S, Li C-I, Guo Y, Sheng Q, Shyr Y. RnaSeqSampleSize: real data based sample size estimation for RNA sequencing.",journal:"BMC Bioinformatics",year:2018,vol:"19:191",doi:"10.1186/s12859-018-2191-5",note:"Estimates sample size from the read-count and dispersion distribution of pilot or public data rather than a single assumed value."},wu2015proper:{cite:"Wu H, Wang C, Wu Z. PROPER: comprehensive power evaluation for differential expression using RNA-seq.",journal:"Bioinformatics",year:2015,vol:"31(2):233\u2013241",doi:"10.1093/bioinformatics/btu640",note:"Simulation-based power evaluation, stratified by expression level, using parameters estimated from real data."},todd2016:{cite:"Todd EV, Black MA, Gemmell NJ. The power and promise of RNA-seq in ecology and evolution.",journal:"Molecular Ecology",year:2016,vol:"25(6):1224\u20131241",doi:"10.1111/mec.13526",note:"Review of RNA-seq design for non-model and wild organisms, where biological variation is typically larger than in laboratory models."},su2020powsc:{cite:"Su K, Wu Z, Wu H. Simulation, power evaluation and sample size recommendation for single-cell RNA-seq.",journal:"Bioinformatics",year:2020,vol:"36(19)",doi:"10.1093/bioinformatics/btaa607",note:"POWSC (Bioconductor): simulation-based power for scRNA-seq differential expression, by cell type and expression level."},squair2021:{cite:"Squair JW, Gautier M, Kathe C, et al. Confronting false discoveries in single-cell differential expression.",journal:"Nature Communications",year:2021,vol:"12:5692",doi:"10.1038/s41467-021-25960-2",note:"Single-cell DE methods that treat cells as independent produce many false discoveries; pseudobulk methods that respect biological replicates perform best. The replicate, not the cell, is the unit of inference."},spencer2009:{cite:"Spencer CCA, S cies.",journal:"Molecular Ecology Resources",year:2017,vol:"17(6):1136\u20131147",doi:"10.1111/1755-0998.12654",note:"ddRAD-seq resampling: about 8 individuals per population gave accurate diversity and differentiation estimates when \u22651,000 SNPs were used."},willing2012:{cite:"Willing E-M, Dreyer C, van Oosterhout C. Estimates of genetic differentiation measured by FST do not necessarily require large sample sizes when using many SNP markers.",journal:"PLoS ONE",year:2012,vol:"7(8):e42649",doi:"10.1371/journal.pone.0042649",note:"Simulations: with >1,000 SNPs, 4\u20136 individuals per population can estimate Fst accurately."},scaketti2025:{cite:"Scaketti M, Sujii PS, Alves-Pereira A, et al. Sample Size Impact (SaSii): an R script for estimating optimal sample sizes in population genetics and population genomics studies.",journal:"PLoS ONE",year:2025,vol:"20(2):e0316634",doi:"10.1371/journal.pone.0316634",note:"R script for resampling pilot genotypes. Across published plant datasets, 5\u201325 individuals sufficed for SNP data and 15\u201330 for SSR data."},puechmaille2016:{cite:"Puechmaille SJ. The program STRUCTURE does not reliably recover the correct population structure when sampling is uneven: subsampling and new estimators alleviate the problem.",journal:"Molecular Ecology Resources",year:2016,vol:"16(3):608\u2013627",doi:"10.1111/1755-0998.12512",note:"Uneven sample sizes across populations bias STRUCTURE's choice of K; balanced sampling or subsampling is recommended."},patterson2006:{cite:"Patterson N, Price AL, Reich D. Population structure and eigenanalysis.",journal:"PLoS Genetics",year:2006,vol:"2(12):e190",doi:"10.1371/journal.pgen.0020190",note:"For two equal subpopulations, structure is essentially undetectable when Fst < 1/\u221A(individuals \xD7 markers). Used in this app's detectability check."},jones2010:{cite:"Jones AG, Small CM, Paczolt KA, Ratterman NL. A practical guide to methods of parentage analysis.",journal:"Molecular Ecology Resources",year:2010,vol:"10(1):6\u201330",doi:"10.1111/j.1755-0998.2009.02778.x",note:"Reviews exclusion, likelihood and full-pedigree methods; assignment accuracy depends on marker polymorphism, number of loci and the fraction of candidate parents sampled."},huisman2017:{cite:"Huisman J. Pedigree reconstruction from SNP data: parentage assignment, sibship clustering and beyond.",journal:"Molecular Ecology Resources",year:2017,vol:"17(5):1009\u20131024",doi:"10.1111/1755-0998.12665",note:"Sequoia R package; handles unsampled parents and sibship clustering with a few hundred SNPs."},lotterhos2014:{cite:"Lotterhos KE, Whitlock MC. Evaluation of demographic history and neutral parameterization on the performance of FST outlier tests.",journal:"Molecular Ecology",year:2014,vol:"23(9):2178\u20132192",doi:"10.1111/mec.12725",note:"False-positive and power rates of Fst outlier tests depend strongly on demographic history and sampling design."},forester2016:{cite:"Forester BR, Jones MR, Joost S, Landguth EL, Lasky JR. Detecting spatial genetic signatures of local adaptation in heterogeneous landscapes.",journal:"Molecular Ecology",year:2016,vol:"25(1):104\u2013120",doi:"10.1111/mec.13476",note:"Simulation comparison of genotype\u2013environment association methods; detection depends on sampling design and selection strength."},excoffier2013:{cite:"Excoffier L, Dupanloup I, Huerta-S\xE1nchez E, Sousa VC, Foll M. Robust demographic inference from genomic and SNP data.",journal:"PLoS Genetics",year:2013,vol:"9(10):e1003905",doi:"10.1371/journal.pgen.1003905",note:"fastsimcoal2 composite-likelihood inference from the site frequency spectrum."},waples2010:{cite:"Waples RS, Do C. Linkage disequilibrium estimates of contemporary Ne using highly variable genetic markers: a largely untapped resource for applied conservation and evolution.",journal:"Evolutionary Applications",year:2010,vol:"3(3):244\u2013262",doi:"10.1111/j.1752-4571.2009.00104.x",note:"Precision of LD-based Ne estimates depends on both sample size and number of loci; small samples relative to true Ne give unbounded estimates."},kelly2015:{cite:"Kelly BJ, Gross R, Bittinger K, et al. Power and sample-size estimation for microbiome studies using pairwise distances and PERMANOVA.",journal:"Bioinformatics",year:2015,vol:"31(15):2461\u20132468",doi:"10.1093/bioinformatics/btv183",note:"micropower R package: simulates PERMANOVA power from pilot distance matrices; required n depends on effect size (\u03C9\xB2) and within-group dispersion."},larosa2012:{cite:"La Rosa PS, Brooks JP, Deych E, et al. Hypothesis testing and power calculations for taxonomic-based human microbiome data.",journal:"PLoS ONE",year:2012,vol:"7(12):e52078",doi:"10.1371/journal.pone.0052078",note:"Dirichlet-multinomial framework and the HMP R package for power and sample-size calculation on taxon counts."},quince2017:{cite:"Quince C, Walker AW, Simpson JT, Loman NJ, Segata N. Shotgun metagenomics, from sampling to analysis.",journal:"Nature Biotechnology",year:2017,vol:"35(9):833\u2013844",doi:"10.1038/nbt.3935",note:"Best practices for shotgun metagenomic study design, including sampling, controls and sequencing depth."},nearing2022:{cite:"Nearing JT, Douglas GM, Hayes MG, et al. Microbiome differential abundance methods produce different results across 38 datasets.",journal:"Nature Communications",year:2022,vol:"13:342",doi:"10.1038/s41467-022-28034-z",note:"14 differential-abundance methods gave very different significant taxa on the same data; ALDEx2 and ANCOM-II were most consistent. Recommends a consensus of methods."},lin2020:{cite:"Lin H, Peddada SD. Analysis of compositions of microbiomes with bias correction.",journal:"Nature Communications",year:2020,vol:"11:3514",doi:"10.1038/s41467-020-17041-7",note:"ANCOM-BC: compositionality-aware differential abundance with bias correction."},topcuoglu2020:{cite:"Top\xE7uo\u011Flu BD, Lesniak NA, Ruffin MT, Wiens J, Schloss PD. A framework for effective application of machine learning to microbiome-based classification problems.",journal:"mBio",year:2020,vol:"11(3):e00434-20",doi:"10.1128/mBio.00434-20",note:"Recommends nested cross-validation and reporting performance variability; shows how model choice and data splitting affect reported AUC."},wirbel2021:{cite:"Wirbel J, Zych K, Essex M, et al. Microbiome meta-analysis and cross-disease comparison enabled by the SIAMCAT machine learning toolbox.",journal:"Genome Biology",year:2021,vol:"22:93",doi:"10.1186/s13059-021-02306-1",note:"SIAMCAT toolbox; highlights confounding and the need for external validation of microbiome classifiers."},cohen1988:{cite:"Cohen J. Statistical Power Analysis for the Behavioral Sciences (2nd ed.).",journal:"Lawrence Erlbaum Associates",year:1988,vol:"",doi:"10.4324/9780203771587",note:"Conventions for effect sizes: d = 0.2 / 0.5 / 0.8 and f = 0.10 / 0.25 / 0.40 (small / medium / large). These are generic conventions; a biologically justified effect size is preferable."},faul2007:{cite:"Faul F, Erdfelder E, Lang A-G, Buchner A. G*Power 3: a flexible statistical power analysis program for the social, behavioral, and biomedical sciences.",journal:"Behavior Research Methods",year:2007,vol:"39(2):175\u2013191",doi:"10.3758/BF03193146",note:"Free program implementing exact power calculations for t-tests, ANOVA and many other designs; use it to reproduce or customise this app's numbers."},schoenfeld1983:{cite:"Schoenfeld DA. Sample-size formula for the proportional-hazards regression model.",journal:"Biometrics",year:1983,vol:"39(2):499\u2013503",doi:"10.2307/2531021",note:"Number of events needed for a log-rank / Cox comparison: D = 4(z\u2081\u208B\u03B1/\u2082 + z\u2081\u208B\u03B2)\xB2 / (ln HR)\xB2 for 1:1 allocation. Used in this app."},lazic2010:{cite:"Lazic SE. The problem of pseudoreplication in neuroscientific studies: is it affecting your analysis?",journal:"BMC Neuroscience",year:2010,vol:"11:5",doi:"10.1186/1471-2202-11-5",note:"The experimental unit \u2014 the entity independently assigned to a treatment (e.g. a tank or cage) \u2014 determines n; treating sub-units as independent inflates false positives."},wutich2024:{cite:"Wutich A, Beresford M, Bernard HR. Sample sizes for 10 types of qualitative data analysis: an integrative review, empirical guidance, and next steps.",journal:"International Journal of Qualitative Methods",year:2024,vol:"23:16094069241296206",doi:"10.1177/16094069241296206",note:"Integrative review behind this section. Theme saturation 9 interviews / 4 focus groups (means 12\u201313 / 5\u20136); meaning saturation 24 interviews / 8 focus groups; theoretical saturation 20\u201330+; metatheme saturation 20\u201340 per site; 10 exhaustive free lists; ethnography 50\u201381 data documents or 20\u201330 interviews."},guest2006:{cite:"Guest G, Bunce A, Johnson L. How many interviews are enough? An experiment with data saturation and variability.",journal:"Field Methods",year:2006,vol:"18(1):59\u201382",doi:"10.1177/1525822X05279903",note:"In 60 interviews from two West African countries, saturation occurred within the first 12 interviews, with basic elements of metathemes present as early as 6."},hennink2022:{cite:"Hennink M, Kaiser BN. Sample sizes for saturation in qualitative research: a systematic review of empirical tests.",journal:"Social Science & Medicine",year:2022,vol:"292:114523",doi:"10.1016/j.socscimed.2021.114523",note:"Systematic review of empirical saturation studies: saturation reached in 9\u201317 interviews or 4\u20138 focus groups, for relatively homogeneous samples and narrow objectives."},hennink2017:{cite:"Hennink MM, Kaiser BN, Marconi VC. Code saturation versus meaning saturation: how many interviews are enough?",journal:"Qualitative Health Research",year:2017,vol:"27(4):591\u2013608",doi:"10.1177/1049732316665344",note:"Code saturation (hearing all issues) at 9 interviews; meaning saturation (understanding them) needed 16\u201324 interviews."},hennink2019:{cite:"Hennink MM, Kaiser BN, Weber MB. What influences saturation? Estimating sample sizes in focus group research.",journal:"Qualitative Health Research",year:2019,vol:"29(10):1483\u20131496",doi:"10.1177/1049732318821692",note:"Four focus groups were sufficient for code saturation; more groups were needed for meaning saturation."},squire2024:{cite:"Squire CM, Giombi KC, Rupert DJ, Amoozegar J, Williams P. Determining an appropriate sample size for qualitative interviews to achieve true and near code saturation: secondary analysis of data.",journal:"Journal of Medical Internet Research",year:2024,vol:"26:e52998",doi:"10.2196/52998",note:"Web-based interviews needed considerably more interviews (estimates of 30\u201367) to reach code saturation."},mason2010:{cite:"Mason M. Sample size and saturation in PhD studies using qualitative interviews.",journal:"Forum Qualitative Sozialforschung / Forum: Qualitative Social Research",year:2010,vol:"11(3)",doi:"10.17169/fqs-11.3.1428",note:"Survey of qualitative PhD theses reporting sample sizes; used in Wutich et al. (2024) as evidence for the 20\u201330+ guideline for grounded theory."},thomson2011:{cite:"Thomson SB. Sample size and grounded theory.",journal:"Journal of Administration and Governance",year:2011,vol:"5:45\u201352",doi:"",url:"https://ssrn.com/abstract=3037218",note:"Review of grounded theory studies; supports 20\u201330+ interviews as typically sufficient to claim theoretical saturation."},glaser1967:{cite:"Glaser BG, Strauss AL. The Discovery of Grounded Theory: Strategies for Qualitative Research.",journal:"Aldine (reprinted Routledge, 2017)",year:1967,vol:"",doi:"10.4324/9780203793206",note:"Defines theoretical saturation and theoretical sampling; sample size cannot be fixed in advance."},hagaman2017:{cite:"Hagaman AK, Wutich A. How many interviews are enough to identify metathemes in multisited and cross-cultural research? Another perspective on Guest, Bunce, and Johnson's (2006) landmark study.",journal:"Field Methods",year:2017,vol:"29(1):23\u201341",doi:"10.1177/1525822X16640447",note:"All metathemes appeared once within 20 interviews per site; up to 39 per site were needed for each to occur \u22653 times. Heterogeneous samples saturated faster (~18) than homogeneous ones (35\u201339)."},weller2018:{cite:"Weller SC, Vickers B, Bernard HR, et al. Open-ended interview questions and saturation.",journal:"PLoS ONE",year:2018,vol:"13(6):e0198606",doi:"10.1371/journal.pone.0198606",note:"About 10 exhaustively probed free lists yield 95% of salient items; superficial interviewing reaches apparent saturation quickly but misses items."},distefano2024:{cite:"DiStefano AS, Yang JS. Sample size and saturation: a three-phase method for ethnographic research with multiple qualitative data sources.",journal:"Field Methods",year:2024,vol:"36(2):145\u2013159",doi:"10.1177/1525822X231194515",note:"50 data documents (33 observations + 17 interviews) identified 80% of themes; 81 documents (55 + 26) identified 90%."},weller2007:{cite:"Weller SC. Cultural consensus theory: applications and frequently asked questions.",journal:"Field Methods",year:2007,vol:"19(4):339\u2013368",doi:"10.1177/1525822X07303502",note:"Cultural consensus analysis of structured questions: about 20\u201330 informants are generally sufficient for a single shared domain; fewer when agreement is high."},krippendorff2013:{cite:"Krippendorff K. Content Analysis: An Introduction to Its Methodology (3rd ed.).",journal:"SAGE Publications",year:2013,vol:"",doi:"",note:"Classical content analysis aimed at generalisation should use random or census sampling, with sample size set by statistical power."},weller2015:{cite:"Weller SC. Sample size estimation: the easy way.",journal:"Field Methods",year:2015,vol:"27(4):333\u2013347",doi:"10.1177/1525822X14530086",note:"Accessible power-analysis approach for non-statisticians, recommended by Wutich et al. (2024) for classical content analysis."},malterud2016:{cite:"Malterud K, Siersma VD, Guassora AD. Sample size in qualitative interview studies: guided by information power.",journal:"Qualitative Health Research",year:2016,vol:"26(13):1753\u20131760",doi:"10.1177/1049732315617444",note:"Information power: more participants are needed for broader aims, less specific samples, no guiding theory, weaker dialogue and cross-case analysis. Gives no formula for a number."},braun2021:{cite:"Braun V, Clarke V. To saturate or not to saturate? Questioning data saturation as a useful concept for thematic analysis and sample-size rationales.",journal:"Qualitative Research in Sport, Exercise and Health",year:2021,vol:"13(2):201\u2013216",doi:"10.1080/2159676X.2019.1704846",note:"Argues that saturation is inconsistent with reflexive thematic analysis and that sample size should be justified pragmatically."},naeem2024:{cite:"Naeem M, Ozuem W, Howell K, Ranfagni S. Demystification and actualisation of data saturation in qualitative research through thematic analysis.",journal:"International Journal of Qualitative Methods",year:2024,vol:"23:16094069241229777",doi:"10.1177/16094069241229777",note:"Proposes the PRICE model (Perspectivation, Recapitulation, Integration, Crystallization, Edification) for assessing saturation in thematic analysis."}};function nd(e){let t=[e.cite,e.journal+(e.year?` (${e.year})`:"")+(e.vol?` ${e.vol}`:"")+"."];return e.doi?t.push(`https://doi.org/${e.doi}`):e.url&&t.push(e.url),t.join(" ")}var p=dr(fa(),1),Yp={empirical:{label:"Empirical benchmark",cls:"ev-emp",help:"Numbers come from published empirical tests."},formula:{label:"Calculated",cls:"ev-calc",help:"Numbers are computed from a power formula with the stated assumptions."},heuristic:{label:"Planning heuristic",cls:"ev-heur",help:"No single benchmark exists; numbers are starting points to check with pilot data."},none:{label:"No benchmark",cls:"ev-none",help:"The literature gives no empirical sample size for this method."}};function yn({name:e,size:t=18}){let n={dna:(0,p.jsxs)(p.Fr
